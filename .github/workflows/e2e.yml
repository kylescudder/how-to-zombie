name: End-to-end
on:
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository-pinned engine and plugin
        run: tools/setup.sh --manager download --yes
      - name: Exercise the real game in headless mode
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e-ci
          { tools/godot --headless -- --solo --linear --test=solo && tools/godot --headless -- --solo --linear --test=campaign; } 2>&1 | tee artifacts/e2e-ci/run.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: game-e2e-evidence
          path: artifacts/e2e-ci/
          retention-days: 7
